cases:
  - id: G01
    question: What was the savings balance at the end of last month?
    metric: balance
    gold_sql: |
      select aum_end from `{gold}.fct_savings_daily`
      where date_day = last_day(date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 month))
    check_sql: |
      select round(sum(end_balance), 2) from `{silver}.int_wallet__account_day`
      where date_day = last_day(date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 month))

  - id: G02
    question: What was net flow over the last 7 days?
    metric: net_flow
    gold_sql: |
      select sum(net_flow_amount) from `{gold}.fct_savings_daily`
      where date_day > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)
    check_sql: |
      select sum(if(txn_type = 'cash_in', amount, -amount)) from `{silver}.stg_wallet__transactions`
      where is_success and txn_type != 'interest' and txn_date > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)

  - id: G03
    question: How many accounts were funded yesterday?
    metric: funded_accounts
    gold_sql: |
      select funded_accounts from `{gold}.fct_savings_daily`
      where date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
    check_sql: |
      select countif(end_balance >= 1) from `{silver}.int_wallet__account_day`
      where date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)

  - id: G04
    question: How many accounts churned last month?
    metric: account_churn
    gold_sql: |
      select sum(churned_accounts) from `{gold}.fct_savings_daily`
      where date_trunc(date_day, month) = date_trunc(date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 month), month)
    check_sql: |
      select countif(lifecycle_state = 'churned') from `{silver}.int_wallet__account_day`
      where date_trunc(date_day, month) = date_trunc(date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 month), month)

  - id: G05
    question: How many distinct accounts deposited through bank transfer yesterday?
    metric: flow_by_channel
    gold_sql: |
      select accounts from `{gold}.agg_savings_flow_daily`
      where date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
        and txn_type = 'cash_in' and channel = 'bank_transfer' and segment = 'all'
    check_sql: |
      select count(distinct account_id) from `{silver}.stg_wallet__transactions`
      where is_success and txn_type = 'cash_in' and channel = 'bank_transfer'
        and txn_date = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)

  - id: G06
    question: What share of users who opened the savings tab yesterday made a deposit?
    metric: deposit_conversion
    gold_sql: |
      select round(safe_divide(users_deposited, users_opened), 4) from `{gold}.fct_deposit_funnel_daily`
      where date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
    check_sql: |
      select round(safe_divide(
        count(distinct if(event_name = 'deposit_success', user_id, null)),
        count(distinct if(event_name = 'open_savings_tab', user_id, null))), 4)
      from `{silver}.stg_app__events`
      where event_date = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)

  - id: G07
    question: What was the on-time delivery rate across all kitchens in the last 7 days?
    metric: on_time_rate
    gold_sql: |
      select round(safe_divide(sum(on_time_orders), sum(completed_orders)), 4) from `{gold}.agg_kitchen_daily`
      where kitchen_id = 'all' and platform = 'all' and date_day > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)
    check_sql: |
      select round(safe_divide(countif(is_on_time), countif(is_completed)), 4) from `{gold}.fct_orders`
      where order_date > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)

  - id: G08
    question: Which kitchen had the highest cancellation rate last week?
    metric: cancel_rate
    gold_sql: |
      select kitchen_id from `{gold}.agg_kitchen_daily`
      where platform = 'all' and kitchen_id != 'all' and date_day > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)
      group by kitchen_id
      order by 1 - sum(completed_orders) / sum(orders) desc
      limit 1
    check_sql: |
      select kitchen_id from `{gold}.fct_orders`
      where order_date > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)
      group by kitchen_id
      order by countif(not is_completed) / count(*) desc
      limit 1

  - id: G10
    question: How many orders did the kitchens take yesterday through the aggregator platforms?
    metric: orders
    gold_sql: |
      select sum(orders) from `{gold}.agg_kitchen_daily`
      where kitchen_id = 'all' and platform in ('aggregator_a', 'aggregator_b')
        and date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
    check_sql: |
      select count(*) from `{silver}.stg_kitchen__orders`
      where platform in ('aggregator_a', 'aggregator_b') and order_date = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)

  - id: G09
    question: What was the average delivery time on the own app last week?
    metric: delivery_time
    gold_sql: |
      select round(safe_divide(sum(delivery_minutes_sum), sum(completed_orders)), 1) from `{gold}.agg_kitchen_daily`
      where kitchen_id = 'all' and platform = 'own_app' and date_day > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)
    check_sql: |
      select round(avg(if(is_completed, delivery_minutes, null)), 1) from `{gold}.fct_orders`
      where platform = 'own_app' and order_date > date_sub(current_date('Asia/Ho_Chi_Minh'), interval 8 day)
