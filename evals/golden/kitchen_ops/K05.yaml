id: K05
area: kitchen_ops
question: How often did own-app orders arrive on time yesterday?
expected_sql: |
  select round(safe_divide(sum(on_time_orders), sum(completed_orders)), 4)
  from `{gold}.agg_kitchen_daily`
  where kitchen_id = 'all' and platform = 'own_app'
    and date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
check_sql: |
  select round(safe_divide(countif(is_completed and delivery_minutes <= 35), countif(is_completed)), 4)
  from `{silver}.int_kitchen__orders_enriched`
  where platform = 'own_app'
    and order_date = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
rubric:
  metric: on_time_rate
  filters:
    - kitchen_id is the 'all' row
    - platform is own_app
    - date_day is yesterday
  grain: one day on one platform
  aggregation: on-time orders over completed orders
