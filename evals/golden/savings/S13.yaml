id: S13
area: savings
question: How much did affluent customers withdraw yesterday?
expected_sql: |
  select amount
  from `{gold}.agg_savings_flow_daily`
  where txn_type = 'cash_out' and channel = 'all' and segment = 'affluent'
    and date_day = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
check_sql: |
  select sum(t.amount)
  from `{silver}.stg_wallet__transactions` as t
  inner join `{silver}.stg_wallet__accounts` as a on t.account_id = a.account_id
  where t.is_success and t.txn_type = 'cash_out' and a.segment = 'affluent'
    and t.txn_date = date_sub(current_date('Asia/Ho_Chi_Minh'), interval 1 day)
rubric:
  metric: flow_by_channel
  filters:
    - txn_type is cash_out
    - segment is affluent
    - channel is the 'all' row
    - date_day is yesterday
  grain: one day on one cube cut
  aggregation: the amount on a single row
