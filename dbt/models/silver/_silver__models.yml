version: 2

models:
  - name: stg_wallet__transactions
    description: One row per ledger movement. Cash out is negative in signed_amount.
    columns:
      - {name: txn_id, data_tests: [unique, not_null]}
      - name: txn_type
        data_tests:
          - accepted_values:
              arguments: {values: [cash_in, cash_out, interest]}
      - name: account_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_wallet__accounts'), field: account_id}

  - name: stg_wallet__accounts
    columns:
      - {name: account_id, data_tests: [unique, not_null]}

  - name: stg_app__events
    columns:
      - name: event_name
        data_tests:
          - accepted_values:
              arguments: {values: [open_savings_tab, start_deposit, deposit_success]}

  - name: stg_kitchen__orders
    columns:
      - {name: order_id, data_tests: [unique, not_null]}

  - name: stg_kitchen__deliveries
    columns:
      - {name: order_id, data_tests: [unique, not_null]}

  - name: int_wallet__account_day
    description: One row per account per day since opening, with end-of-day balance and lifecycle state.

  - name: util_calendar
    columns:
      - {name: date_day, data_tests: [unique, not_null]}
