name: saola
version: "1.4.0"
config-version: 2
profile: saola

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  report_timezone: Asia/Ho_Chi_Minh
  on_time_minutes: 35

models:
  saola:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
    utilities:
      +schema: silver
      +materialized: table
